name: Build AHbsolute

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      AH_PACKAGE: com.ahbsolute.app
      UPSTREAM_REF: master
    steps:
      - name: Checkout AHbsolute patches
        uses: actions/checkout@v4

      - name: Require your own api_id (Telegram API Terms 2.1)
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::Add repository secret TG_API_ID (https://my.telegram.org -> API development tools)."
            exit 1
          fi
          if [ -z "$TG_API_HASH" ]; then
            echo "::error::Add repository secret TG_API_HASH (https://my.telegram.org -> API development tools)."
            exit 1
          fi

      - name: Free disk space
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          exit 0

      - name: Checkout Telegram-Android (upstream source)
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-Android
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          set +e
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(command -v sdkmanager)
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1
          echo "licenses step done"
          exit 0

      - name: Install the NDK version the project asks for
        run: |
          set +e
          NDK=$(grep -rhoE 'ndkVersion[[:space:]]*=?[[:space:]]*"[0-9.]+"' upstream --include=build.gradle --include=build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "NDK: ${NDK}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(command -v sdkmanager)
          fi
          if [ -n "$NDK" ]; then
            yes | "$SDKM" "ndk;$NDK" > /dev/null
          fi
          exit 0

      - name: Python deps
        run: pip install pillow

      - name: Optional own google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > "$RUNNER_TEMP/gs.json"
            echo "GOOGLE_SERVICES_JSON_PATH=$RUNNER_TEMP/gs.json" >> "$GITHUB_ENV"
          fi

      - name: Patch and build (with automatic fallback)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHbsolute-apk-${{ env.MODE }}
          path: upstream/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
